# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: js_bridge_polling_loop
    status: active
    description: "GDScript must not use a _process()-driven JavaScriptBridge.eval() poll to check a JS-side state flag instead of a registered callback."
    why: "Violates the project's signal-first/no-polling architecture principle; adds per-frame eval overhead."
    adr: docs/architecture/adr-0003-js-ad-bridge.md
    added: 2026-07-27

  - pattern: js_callback_without_preregistration
    status: active
    description: "A JS eval string must never reference a callback object/method that was not first created and bound via JavaScriptBridge.create_callback() in _ready(), before any eval() call that could invoke it."
    why: "Produces a ReferenceError crash — the exact bug found in #18 광고 통합."
    adr: docs/architecture/adr-0003-js-ad-bridge.md
    added: 2026-07-27

  - pattern: rng_global_calls_in_deterministic_systems
    status: active
    description: "#2 랜덤 던전, #4 장비, #9 히든 트리거 (and any future randomness-dependent system) must never call Godot's global randi()/randf()/Array.pick_random(); randomness must arrive via an injected RandomNumberGenerator parameter."
    why: "Global RNG state can't be seeded per-test-case in isolation, breaking the project's deterministic-testing standard and run-wide seed reproducibility."
    adr: docs/architecture/adr-0005-rng-injection-pattern.md
    added: 2026-07-27

  - pattern: resource_schema_new_severity_tier
    status: active
    description: "A new stat-bearing Resource schema must not invent a third validation-severity tier beyond 'base_hp-style field rejects (push_error)' / 'everything else warns (push_warning)' without a new ADR amending ADR-0007."
    why: "Prevents inconsistent crash-handling policy drifting independently per schema."
    adr: docs/architecture/adr-0007-resource-schema-buildtime-validation.md
    added: 2026-07-27

  - pattern: resource_stat_clamping
    status: active
    description: "Out-of-range stat/multiplier values (other than the base_hp<=0 reject case) must never be silently clamped to a valid bound."
    why: "Clamping masks designer error and blocks intentional out-of-range value testing the GDDs explicitly require."
    adr: docs/architecture/adr-0007-resource-schema-buildtime-validation.md
    added: 2026-07-27

  - pattern: bare_floor_into_int_context
    status: active
    description: "floor() (returns float) must never be used where the result is assigned to, compared against, or otherwise consumed as an int (HP, damage, stat values); floori() must be used instead."
    why: "Type friction / silent bugs; floori() (Godot 4.2+) returns int directly."
    adr: docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    added: 2026-07-27

  - pattern: unguarded_float_multiplier_damage_math
    status: active
    description: "Any floori(x * multiplier) pattern feeding damage math must never omit the +0.0001 epsilon guard."
    why: "Float precision loss can silently under-deal damage by 1 point — a real bug found in #6's design review."
    adr: docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    added: 2026-07-27

  - pattern: unstable_sort_without_tiebreak
    status: active
    description: "Array.sort_custom() must never be used with a comparator lacking an explicit secondary (tie-break) key when deterministic tie resolution is required (e.g. turn order, targeting)."
    why: "Godot's Array.sort()/sort_custom() is not stable; equal-key order is unguaranteed. Independently rediscovered twice already (#6, #7)."
    adr: docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    added: 2026-07-27

  - pattern: unduplicated_shared_resource_mutation
    status: active
    description: "A Resource loaded from a shared registry/cache (e.g. a StatusEffect blueprint) must never be attached directly to a per-unit mutable collection without an intervening .duplicate() call."
    why: "Godot Resources are cached and shared by reference; mutating an un-duplicated instance corrupts the shared blueprint and leaks state across every unit holding it — a real bug found in #12's design review."
    adr: docs/architecture/adr-0009-resource-duplication-policy.md
    added: 2026-07-27

  - pattern: input_wait_polling_loop
    status: active
    description: "Game logic must never wait for player input via a _process()/_physics_process() boolean-flag poll."
    why: "Wastes CPU cycles and violates the project's signal-first architecture principle."
    adr: docs/architecture/adr-0010-await-coroutine-pattern.md
    added: 2026-07-27

  - pattern: yield_coroutine_syntax
    status: active
    description: "yield() (Godot 3.x coroutine mechanism) must never be used or referenced in code, docs, or comments — it does not exist in 4.x."
    why: "Prevents confusion carried over from outdated 3.x tutorials/patterns; await custom_signal is the only approved mechanism."
    adr: docs/architecture/adr-0010-await-coroutine-pattern.md
    added: 2026-07-27

  - pattern: manual_bool_toggle_for_confirmation_state
    status: active
    description: "Tracking 'has the player confirmed/selected yet' via a manually toggled bool flag (rather than await custom_signal) must never be used."
    why: "The flag doesn't reset on exception/early-return paths, permanently locking player input — a bug class #3 동료 해금's Core Rule 3 explicitly calls out."
    adr: docs/architecture/adr-0010-await-coroutine-pattern.md
    added: 2026-07-27

  - pattern: player_input_wait_timeout
    status: active
    description: "A player-input await coroutine (await action_selected, await popup_confirmed, etc.) must never be wrapped in a 'just in case' timeout."
    why: "Contradicts the turn-based genre requirement of unbounded waiting for player decisions; conflates player-decision-time uncertainty with the unrelated external-SDK-reliability uncertainty that ADR-0003's ad-callback timeout addresses."
    adr: docs/architecture/adr-0010-await-coroutine-pattern.md
    added: 2026-07-27

  - pattern: native_focus_dependency_for_touch_ui
    status: active
    description: "#20 UI/HUD custom tap interactions (action button highlight, target highlight, popup confirm button) must never depend on Godot's native Focus system (grab_focus(), has_focus(), focus StyleBox)."
    why: "Godot 4.6's dual-focus system separates mouse/touch focus from keyboard/gamepad focus in a way undocumented for this project's touch-only, gamepad-less UI."
    adr: docs/architecture/adr-0011-dual-focus-ui-strategy.md
    added: 2026-07-27

  - pattern: ui_polling_or_caching_other_systems_state
    status: active
    description: "Presentation-layer nodes must never (a) poll another system's owned data in _process()/_physics_process() by comparing against a stored previous value, or (b) hold a member variable that is a duplicated copy of data owned by another system for that comparison. Self-owned presentation state (e.g. #20's popup queue) is explicitly not covered by this ban."
    why: "Violates the signal-first architecture principle and creates a second source of truth that can drift from the owning system's actual state."
    adr: docs/architecture/adr-0012-ui-signal-subscription-convention.md
    added: 2026-07-27

