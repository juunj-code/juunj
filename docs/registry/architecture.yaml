# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: run_manager_signals
    status: active
    pattern: signal
    producer: run-state
    consumers:
      - UNCONFIRMED — ADR-0002's own catalog found zero exact-name GDD citations for any of the 5 signals; verify actual subscribers at implementation time
    adr: docs/architecture/adr-0002-autoload-init-order-signal-catalog.md
    signal_signature: "floor_changed(new_floor: int) / combat_entered(enemies: Array[EnemyRunState]) / combat_exited(victory: bool) / run_ended(success: bool) / state_changed(old_state: String, new_state: String)"
    referenced_by:
      - docs/architecture/adr-0002-autoload-init-order-signal-catalog.md
    added: 2026-07-27
    revised: ""

  - contract: progression_boot_load
    status: active
    pattern: direct_call
    producer: save
    consumers:
      - progression
    adr: docs/architecture/adr-0002-autoload-init-order-signal-catalog.md
    signal_signature: "SaveManager.load_section() — called synchronously from ProgressManager._ready(); SaveManager must precede ProgressManager in project.godot [autoload] order"
    referenced_by:
      - docs/architecture/adr-0002-autoload-init-order-signal-catalog.md
    added: 2026-07-27
    revised: ""

  - contract: js_gdscript_callback_bridge
    status: active
    pattern: direct_call
    producer: ads
    consumers:
      - save
    adr: docs/architecture/adr-0003-js-ad-bridge.md
    signal_signature: "_ready()-time pre-registration: JavaScriptBridge.eval('window.<Bridge> = {};') then get_interface('window').<Bridge>.<method> = JavaScriptBridge.create_callback(_on_js_callback); DI shim + reentry guard mandatory wherever a timeout failsafe coexists"
    referenced_by:
      - docs/architecture/adr-0003-js-ad-bridge.md
      - docs/architecture/adr-0001-html5-local-save-sync.md
    added: 2026-07-27
    revised: ""

  - contract: save_completion_signal
    status: active
    pattern: signal
    producer: save
    consumers:
      - ui-hud
    adr: docs/architecture/adr-0001-html5-local-save-sync.md
    signal_signature: "SaveManager emits its final 'Save Complete' signal only after _on_indexeddb_sync_done() confirms FS.syncfs() succeeded (web) — not merely after FileAccess bool success"
    referenced_by:
      - docs/architecture/adr-0001-html5-local-save-sync.md
    added: 2026-07-27
    revised: ""

  - contract: player_input_await
    status: active
    pattern: signal
    producer: ui-hud
    consumers:
      - turn-based-combat
      - companion-unlock
    adr: docs/architecture/adr-0010-await-coroutine-pattern.md
    signal_signature: "action_selected(action_data: Dictionary) / target_selected(target_id: String) / popup_confirmed — consumed via `await <signal>`, never polling, never yield(); is_inside_tree() guard required immediately on resume"
    referenced_by:
      - docs/architecture/adr-0010-await-coroutine-pattern.md
      - docs/architecture/adr-0012-ui-signal-subscription-convention.md
    added: 2026-07-27
    revised: ""

  - contract: ui_state_subscription
    status: active
    pattern: signal
    producer: cross-cutting
    consumers:
      - ui-hud
    adr: docs/architecture/adr-0012-ui-signal-subscription-convention.md
    signal_signature: "All subscriptions connected once in _ready(); handler updates the view immediately, no comparison against a stored previous value, no local copy of another system's data (UI-owned presentation state, e.g. the popup queue, is not covered by this ban)"
    referenced_by:
      - docs/architecture/adr-0012-ui-signal-subscription-convention.md
      - docs/architecture/adr-0010-await-coroutine-pattern.md
    added: 2026-07-27
    revised: ""

