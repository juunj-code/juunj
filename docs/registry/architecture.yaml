# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: html5_save_durability_confirmation
    status: active
    api: "JavaScriptBridge.eval(\"FS.syncfs(false, callback)\") + JavaScriptBridge.create_callback()"
    not: "FileAccess.close() alone as the durability signal"
    adr: docs/architecture/adr-0001-html5-local-save-sync.md
    reason: "Whether close() auto-triggers syncfs() (and sync vs async) is undocumented for 4.4-4.6; treating close() as sufficient is a silent-failure risk for the project's most player-trust-critical guarantee"
    referenced_by:
      - docs/architecture/adr-0001-html5-local-save-sync.md
    added: 2026-07-27
    revised: ""

  - purpose: js_gdscript_async_callback_pattern
    status: active
    api: "_ready()-time pre-registered JavaScriptBridge.create_callback() + get_interface(\"window\") + _js_bridge DI shim + reentry guard"
    not: "_process()-driven JS polling loop checking a window.* flag every frame"
    adr: docs/architecture/adr-0003-js-ad-bridge.md
    reason: "Polling violates the signal-first/no-polling architecture principle and adds per-frame eval overhead; pre-registration prevents the ReferenceError bug class actually found in #18"
    referenced_by:
      - docs/architecture/adr-0003-js-ad-bridge.md
      - docs/architecture/adr-0001-html5-local-save-sync.md
    added: 2026-07-27
    revised: ""

  - purpose: web_export_scene_loading_variant
    status: active
    api: "Regular (non-threaded) HTML5 export variant + ResourceLoader.load_threaded_request()/load_threaded_get_status() with _process(delta)-accumulated (not wall-clock) timeout"
    not: "Threads export variant + COOP/COEP cross-origin isolation headers"
    adr: docs/architecture/adr-0004-scene-threaded-loading-coop-coep.md
    reason: "itch.io's support for custom COOP/COEP response headers is unverified; a Threads build that fails to load on an unsupported host is an unacceptable deploy-time risk"
    referenced_by:
      - docs/architecture/adr-0004-scene-threaded-loading-coop-coep.md
    added: 2026-07-27
    revised: ""

  - purpose: procedural_rng_source
    status: active
    api: "RandomNumberGenerator instance injected as an explicit parameter, owned/created once by RunManager.start_run()"
    not: "Godot global randi()/randf()/Array.pick_random()"
    adr: docs/architecture/adr-0005-rng-injection-pattern.md
    reason: "Global RNG state can't be seeded per-test-case in isolation, directly violating the project's DI-over-singletons and no-random-seeds testing standards"
    referenced_by:
      - docs/architecture/adr-0005-rng-injection-pattern.md
    added: 2026-07-27
    revised: ""

  - purpose: shared_data_loader_implementation
    status: active
    api: "static class_name DataRegistryLoader with stateless static methods (load_all(folder_path, reject_if_invalid))"
    not: "An Autoload singleton for the loader utility itself"
    adr: docs/architecture/adr-0006-data-registry-shared-utility.md
    reason: "The loader is stateless and needs no Autoload lifecycle/boot-order participation, unlike CompanionRegistry/EnemyRegistry which do (ADR-0002)"
    referenced_by:
      - docs/architecture/adr-0006-data-registry-shared-utility.md
    added: 2026-07-27
    revised: ""

  - purpose: resource_color_field_type
    status: active
    api: "native Color (@export var x: Color)"
    not: "hex string or int-packed color representation"
    adr: docs/architecture/adr-0007-resource-schema-buildtime-validation.md
    reason: "A hex-string color_accent field was actually caught and corrected during #10's design review; native Color removes per-consumer parsing/fallback duplication project-wide"
    referenced_by:
      - docs/architecture/adr-0007-resource-schema-buildtime-validation.md
    added: 2026-07-27
    revised: ""

  - purpose: resource_validation_severity_policy
    status: active
    api: "base_hp <= 0 → push_error + reject (not registered); every other out-of-range stat/multiplier → push_warning + load unchanged"
    not: "Clamping any out-of-range value, including base_hp, to a valid bound"
    adr: docs/architecture/adr-0007-resource-schema-buildtime-validation.md
    reason: "Clamping masks designer error and blocks GDD-required intentional out-of-range testing; base_hp<=0 is uniquely crash-class"
    referenced_by:
      - docs/architecture/adr-0007-resource-schema-buildtime-validation.md
    added: 2026-07-27
    revised: ""

  - purpose: int_damage_rounding
    status: active
    api: "floori(atk * multiplier + 0.0001) - defense"
    not: "bare floor() (returns float) fed into an int-typed field, or floori() without the +0.0001 epsilon guard"
    adr: docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    reason: "floor() causes int/float type friction; float precision loss (e.g. 25*1.16 → 28.999999999999996) silently underdeals damage by 1 without the epsilon guard — a bug found in #6's design review"
    referenced_by:
      - docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    added: 2026-07-27
    revised: ""

  - purpose: deterministic_tiebreak_ordering
    status: active
    api: "Array.sort_custom() with an explicit secondary (tie-break) key when full ordering is needed; linear scan/reduce when only a single extremum is needed"
    not: "Relying on Array.sort()/sort_custom()'s incidental ordering of equal-key elements"
    adr: docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    reason: "Godot's Array.sort()/sort_custom() is not a stable sort; this bug class was independently rediscovered twice (turn order in #6, targeting in #7)"
    referenced_by:
      - docs/architecture/adr-0008-combat-formula-float-sort-stability.md
    added: 2026-07-27
    revised: ""

  - purpose: shared_resource_instance_duplication
    status: active
    api: "Shallow .duplicate() before attaching a shared-registry Resource (e.g. StatusEffect) to a mutable per-unit collection"
    not: "duplicate_deep() (unneeded — schema has no nested Resource fields) or direct reference assignment"
    adr: docs/architecture/adr-0009-resource-duplication-policy.md
    reason: "Godot Resources loaded via load()/preload() are cached and shared by reference; an un-duplicated attach lets one unit's mutation corrupt every other unit's copy — a proven real bug from #12's design review"
    referenced_by:
      - docs/architecture/adr-0009-resource-duplication-policy.md
    added: 2026-07-27
    revised: ""

  - purpose: player_input_wait_mechanism
    status: active
    api: "await custom_signal (GDScript 2.0 native coroutine), with an is_inside_tree() guard as the first statement on resume"
    not: "_process()/_physics_process() bool-flag polling; yield() (removed in 4.x); timeout-wrapping a player-input wait"
    adr: docs/architecture/adr-0010-await-coroutine-pattern.md
    reason: "Turn-based genre requires unbounded waiting for player input; a timeout here conflates player-decision-time with the unrelated external-SDK-reliability uncertainty ADR-0003's timeouts exist for"
    referenced_by:
      - docs/architecture/adr-0010-await-coroutine-pattern.md
    added: 2026-07-27
    revised: ""

  - purpose: touch_ui_selection_state_tracking
    status: active
    api: "Explicit custom boolean/enum state (e.g. highlight_state) toggled directly by signal handlers, rendered via custom StyleBoxFlat/_draw()"
    not: "Godot's native Focus system (grab_focus(), has_focus(), focus StyleBox)"
    adr: docs/architecture/adr-0011-dual-focus-ui-strategy.md
    reason: "Godot 4.6's dual-focus system separates mouse/touch focus from keyboard/gamepad focus in a way this project's engine reference does not fully document for touch-only Control UI; the project has no gamepad/keyboard-navigation requirement. Requires a mandatory pre-implementation measurement gate before #20 stories start."
    referenced_by:
      - docs/architecture/adr-0011-dual-focus-ui-strategy.md
    added: 2026-07-27
    revised: ""

