# NOTE (2026-07-27 initial population): architecture.md's Phase 0b independently
# claims ~60 TRs total (60/60 mapped to a Proposed ADR) but only names 12 specific
# TR-IDs inline (e.g. TR-run-state-004, TR-ui-hud-005) without ever listing the
# full ~60-item set anywhere in the repo. This first population reconstructs
# entries from the 12 ADRs' "GDD Requirements Addressed" tables, using the same
# system slugs architecture.md already uses wherever it names one. Where an ADR's
# table had more or fewer distinct rows than architecture.md's numeric range
# implies for that ADR, numbering here is best-effort and NOT guaranteed to align
# 1:1 with architecture.md's original (unrecovered) extraction — reconcile on the
# next full /architecture-review pass. IDs are still permanent once set per the
# rules above; only add new entries, never renumber these.

